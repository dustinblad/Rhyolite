<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgSquircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="50%" stop-color="#0B0D14"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="crystalLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2997FF"/>
      <stop offset="100%" stop-color="#0071E3"/>
    </linearGradient>
    <linearGradient id="crystalRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071E3"/>
      <stop offset="100%" stop-color="#004080"/>
    </linearGradient>
    <linearGradient id="crystalTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70D7FF"/>
      <stop offset="100%" stop-color="#2997FF"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#2997FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0071E3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Apple HIG macOS/iOS Squircle Container -->
  <rect x="20" y="20" width="472" height="472" rx="108" ry="108" fill="url(#bgSquircle)" stroke="#2C303E" stroke-width="4"/>
  <circle cx="256" cy="256" r="210" fill="url(#coreGlow)"/>

  <!-- Crystalline Rhyolite Prism Facets -->
  <polygon points="256,76 132,190 256,244" fill="url(#crystalTop)" opacity="0.95"/>
  <polygon points="256,76 380,190 256,244" fill="url(#crystalLeft)" opacity="0.88"/>
  <polygon points="132,190 166,356 256,244" fill="url(#crystalLeft)" opacity="0.92"/>
  <polygon points="380,190 346,356 256,244" fill="url(#crystalRight)" opacity="0.92"/>
  <polygon points="166,356 256,436 256,244" fill="url(#crystalLeft)" opacity="0.82"/>
  <polygon points="346,356 256,436 256,244" fill="url(#crystalRight)" opacity="0.96"/>

  <!-- Knowledge Graph Constellation Edges -->
  <g stroke="#FFFFFF" stroke-width="3.5" stroke-opacity="0.72" stroke-linecap="round">
    <line x1="256" y1="76" x2="256" y2="244"/>
    <line x1="132" y1="190" x2="256" y2="244"/>
    <line x1="380" y1="190" x2="256" y2="244"/>
    <line x1="166" y1="356" x2="256" y2="244"/>
    <line x1="346" y1="356" x2="256" y2="244"/>
    <line x1="256" y1="436" x2="256" y2="244"/>
    <line x1="132" y1="190" x2="256" y2="76"/>
    <line x1="380" y1="190" x2="256" y2="76"/>
    <line x1="132" y1="190" x2="166" y2="356"/>
    <line x1="380" y1="190" x2="346" y2="356"/>
    <line x1="166" y1="356" x2="256" y2="436"/>
    <line x1="346" y1="356" x2="256" y2="436"/>
  </g>

  <!-- Knowledge Graph Nodes -->
  <g fill="#FFFFFF">
    <circle cx="256" cy="76" r="10"/>
    <circle cx="132" cy="190" r="10"/>
    <circle cx="380" cy="190" r="10"/>
    <circle cx="256" cy="244" r="15" fill="#70D7FF" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="166" cy="356" r="10"/>
    <circle cx="346" cy="356" r="10"/>
    <circle cx="256" cy="436" r="10"/>
  </g>
</svg>
